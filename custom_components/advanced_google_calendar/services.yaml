list_events:
  target:
    entity:
      integration: advanced_google_calendar
      domain: calendar
  fields:
    start_date_time:
      example: "2026-11-16 00:00:00"
      selector:
        datetime:
    end_date_time:
      example: "2026-11-23 00:00:00"
      selector:
        datetime:
    duration:
      selector:
        duration:

update_event:
  target:
    entity:
      integration: advanced_google_calendar
      domain: calendar
  fields:
    uid:
      required: true
      example: "abc123def456"
      selector:
        text:
    recurrence_id:
      example: "abc123def456_20261120T090000Z"
      selector:
        text:
    recurrence_range:
      selector:
        select:
          options:
            - ""
            - "THISANDFUTURE"
    summary:
      example: "Training"
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    location:
      selector:
        text:
    start_date_time:
      selector:
        datetime:
    end_date_time:
      selector:
        datetime:
    start_date:
      selector:
        date:
    end_date:
      selector:
        date:
    rrule:
      example: "FREQ=WEEKLY;BYDAY=MO,WE"
      selector:
        text:

delete_event:
  target:
    entity:
      integration: advanced_google_calendar
      domain: calendar
  fields:
    uid:
      required: true
      example: "abc123def456"
      selector:
        text:
    recurrence_id:
      example: "abc123def456_20261120T090000Z"
      selector:
        text:
    recurrence_range:
      selector:
        select:
          options:
            - ""
            - "THISANDFUTURE"

sync_calendar:
  fields:
    source_entity_id:
      required: true
      selector:
        entity:
          domain: calendar
    target_entity_id:
      required: true
      selector:
        entity:
          integration: advanced_google_calendar
          domain: calendar
    days_past:
      required: true
      default: 7
      selector:
        number:
          min: 0
          max: 365
          mode: box
          unit_of_measurement: d
    days_future:
      required: true
      default: 30
      selector:
        number:
          min: 0
          max: 730
          mode: box
          unit_of_measurement: d
    include_details:
      default: true
      selector:
        boolean:
    include_all_day:
      default: true
      selector:
        boolean:
    include_regex:
      example: "Training|Jagd"
      selector:
        text:
    exclude_regex:
      example: "privat|Arzt"
      selector:
        text:
    dry_run:
      required: true
      default: false
      selector:
        boolean:
