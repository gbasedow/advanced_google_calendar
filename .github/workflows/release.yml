name: Release

# Creates a GitHub release (tag vX.Y.Z) whenever the version in manifest.json
# changes. The release notes are taken from the matching section in CHANGELOG.md.
on:
  push:
    branches:
      - main
      - claude/practical-meitner-y4ejb8
    paths:
      - custom_components/advanced_google_calendar/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/advanced_google_calendar/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do"
            exit 0
          fi
          awk -v v="$version" '
            /^## / { p = (index($0, "## " v " ") == 1 || $0 == "## " v) }
            p
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Version ${version}" > notes.md
          fi
          printf '\nVoraussetzung: Home Assistant 2025.10 oder neuer.\n' >> notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            --latest
